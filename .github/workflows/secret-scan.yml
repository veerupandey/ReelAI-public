name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Scan full Git history
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --log-opts="--all --full-history" --redact=100 --no-banner
